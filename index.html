<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student JS9 Astronomy Workbench</title>

  <!-- JS9 CSS Dependencies -->
  <link type="text/css" rel="stylesheet" href="https://js9.si.edu/js9/js9support.css">
  <link type="text/css" rel="stylesheet" href="https://js9.si.edu/js9/js9.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Left Sidebar Workflow Container */
    #sidebar {
      width: 360px;
      background-color: #1e1e1e;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      padding: 15px;
      gap: 15px;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #61dafb;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }

    /* Accordion Step Card Styling */
    .step-card {
      background: #282828;
      border: 1px solid #383838;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-header {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-number {
      background: #61dafb;
      color: #121212;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    /* Controls & Buttons */
    button, select {
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    button:hover { background: #4a4a4a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Loaded Images List */
    .image-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .image-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #333;
    }
    .image-item.active {
      border-color: #61dafb;
      background: #223038;
    }

    .image-label {
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      flex-grow: 1;
    }

    .active-eye {
      color: #61dafb;
      font-size: 0.9rem;
      visibility: hidden;
    }
    .image-item.active .active-eye { visibility: visible; }

    .color-select {
      font-size: 0.75rem;
      padding: 2px 4px;
      background: #2a2a2a;
    }

    .btn-close {
      background: #444;
      color: #ccc;
      border: none;
      padding: 2px 7px;
      border-radius: 3px;
      margin-left: 6px;
      font-weight: bold;
    }
    .btn-close:hover { background: #e81123; color: #fff; }

    /* Scaling Controls */
    .scale-toggle {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.85rem;
    }

    .range-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .range-group label { font-size: 0.75rem; color: #aaa; }

    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .range-row input[type="range"] { flex: 1; }
    .range-row input[type="number"] {
      width: 75px;
      background: #181818;
      border: 1px solid #444;
      color: #fff;
      padding: 4px;
      border-radius: 3px;
      font-size: 0.8rem;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Modal / Popup File Selector */
    .modal-overlay {
      position: fixed;
      top:0; left:0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #252525;
      border: 1px solid #444;
      border-radius: 8px;
      width: 450px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 12px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .object-group-title {
      font-size: 0.95rem;
      color: #61dafb;
      margin-bottom: 6px;
    }

    .filter-btn-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Main JS9 Viewport Area */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #050505;
      padding: 10px;
      overflow: auto;
    }

    .JS9Menubar { border-radius: 4px 4px 0 0; }
    .JS9 { border-radius: 0 0 4px 4px; }
  </style>
</head>
<body>

  <!-- Left Edge Workflow Sidebar -->
  <div id="sidebar">
    <div class="app-title">JS9 Image Processor</div>

    <!-- Step 1: File Selection -->
    <div class="step-card">
      <div class="step-header">
        <span class="step-number">1</span>
        <span>File Selection</span>
      </div>
      <button id="btn-open-modal">➕ Select Image to Load</button>
    </div>

    <!-- Step 2: Loaded Images Manager -->
    <div class="step-card">
      <div class="step-header">
        <span class="step-number">2</span>
        <span>Loaded Images</span>
      </div>
      <div id="loaded-images-list" class="image-list">
        <div style="font-size: 0.8rem; color: #888;">No images loaded yet.</div>
      </div>
    </div>

    <!-- Step 3: Adjust Scaling -->
    <div class="step-card">
      <div class="step-header">
        <span class="step-number">3</span>
        <span>Adjust Scaling</span>
      </div>
      
      <div class="scale-toggle">
        <label><input type="radio" name="scaleType" value="linear"> Linear</label>
        <label><input type="radio" name="scaleType" value="log" checked> Logarithmic</label>
      </div>

      <div class="range-group">
        <label>Low Brightness Limit (z1)</label>
        <div class="range-row">
          <input type="range" id="slider-low" step="any">
          <input type="number" id="input-low" step="any">
        </div>
      </div>

      <div class="range-group">
        <label>High Brightness Limit (z2)</label>
        <div class="range-row">
          <input type="range" id="slider-high" step="any">
          <input type="number" id="input-high" step="any">
        </div>
      </div>
    </div>

    <!-- Step 4: Labels -->
    <div class="step-card">
      <div class="step-header">
        <span class="step-number">4</span>
        <span>Labels & Markings</span>
      </div>
      <div class="btn-grid">
        <button onclick="addCircleRegion()">⭕ Add Circle</button>
        <button onclick="addTextRegion()">🔤 Add Text</button>
      </div>
      <button style="background: #5a2525; border-color: #773333;" onclick="clearAllRegions()">🗑️ Delete All Regions</button>
    </div>

    <!-- Step 5: Measure -->
    <div class="step-card">
      <div class="step-header">
        <span class="step-number">5</span>
        <span>Measure & Analyze</span>
      </div>
      <div class="btn-grid">
        <button onclick="addLineRegion()">📏 Add Line</button>
        <button onclick="runRegionStats()">📊 Region Stats</button>
      </div>
    </div>
  </div>

  <!-- Main Viewport Area with JS9 -->
  <div id="main-content">
    <div class="JS9Menubar" id="JS9Menubar"></div>
    <div class="JS9" id="JS9"></div>
  </div>

  <!-- File Selection Modal Popup -->
  <div class="modal-overlay" id="file-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Select Telescope Image</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-object-list">
        <!-- Dynamically populated from JSON -->
      </div>
    </div>
  </div>

  <!-- JS9 JavaScript Dependencies -->
  <script type="text/javascript" src="https://js9.si.edu/js9/js9support.min.js"></script>
  <script type="text/javascript" src="https://js9.si.edu/js9/js9.min.js"></script>
  <script type="text/javascript" src="https://js9.si.edu/js9/js9plugins.js"></script>

  <script>
    // Application State Management
    let loadedImages = []; // Array of { id, objectId, objectName, filterName, filename, assignedColor }
    let activeImageId = null;
    let catalogData = null;

    // Fetch JSON manifest on initialization
    window.addEventListener('DOMContentLoaded', () => {
      fetch('images.json')
        .then(res => res.json())
        .then(data => {
          catalogData = data;
          renderModalCatalog(data);
        })
        .catch(err => {
          console.warn("Could not load images.json file. Modal will use fallback standard manifest.", err);
        });

      setupScaleListeners();
    });

    // --- Modal Handler ---
    const modal = document.getElementById('file-modal');
    document.getElementById('btn-open-modal').onclick = () => modal.classList.add('open');
    function closeModal() { modal.classList.remove('open'); }

    function renderModalCatalog(data) {
      const container = document.getElementById('modal-object-list');
      container.innerHTML = '';

      data.objects.forEach(obj => {
        const group = document.createElement('div');
        group.className = 'object-group';

        const title = document.createElement('div');
        title.className = 'object-group-title';
        title.textContent = obj.name;
        group.appendChild(title);

        const btnList = document.createElement('div');
        btnList.className = 'filter-btn-list';

        obj.images.forEach(img => {
          const btn = document.createElement('button');
          btn.textContent = img.filter;
          btn.onclick = () => {
            loadImage(obj.id, obj.name, img.filter, img.file);
            closeModal();
          };
          btnList.appendChild(btn);
        });

        group.appendChild(btnList);
        container.appendChild(group);
      });
    }

    // --- JS9 Image Loading & Management ---
    function loadImage(objectId, objectName, filterName, filepath) {
      // Check if image is already loaded
      const existing = loadedImages.find(img => img.filename === filepath);
      if (existing) {
        setActiveImage(existing.id);
        return;
      }

      // Generate clean internal ID
      const imageId = 'img_' + Math.random().toString(36).substr(2, 9);
      
      const newImg = {
        id: imageId,
        objectId: objectId,
        objectName: objectName,
        filterName: filterName,
        filename: filepath,
        assignedColor: 'grey'
      };

      loadedImages.push(newImg);

      // Load FITS into JS9 display
      JS9.Load(filepath, {
        id: imageId,
        onload: () => {
          setActiveImage(imageId);
          updateImageScaleUI();
        }
      });

      renderLoadedImagesUI();
    }

    function setActiveImage(id) {
      activeImageId = id;
      const imgObj = loadedImages.find(i => i.id === id);
      if (imgObj) {
        JS9.SetImage(id);
      }
      renderLoadedImagesUI();
      updateImageScaleUI();
    }

    function closeImage(id, event) {
      if (event) event.stopPropagation();
      
      JS9.CloseImage(id);
      loadedImages = loadedImages.filter(img => img.id !== id);

      if (activeImageId === id) {
        activeImageId = loadedImages.length > 0 ? loadedImages[loadedImages.length - 1].id : null;
      }

      evaluateRGBState();
      renderLoadedImagesUI();
      updateImageScaleUI();
    }

    // --- Color Scheme & RGB Rules Engine ---
    function changeImageColor(id, newColor) {
      const targetImg = loadedImages.find(i => i.id === id);
      if (!targetImg) return;

      const oldColor = targetImg.assignedColor;
      targetImg.assignedColor = newColor;

      if (newColor !== 'grey') {
        // Rule 1: Reset images of any DIFFERENT object to grayscale
        loadedImages.forEach(img => {
          if (img.objectId !== targetImg.objectId && img.assignedColor !== 'grey') {
            img.assignedColor = 'grey';
            JS9.SetColormap('grey', { display: img.id });
          }
        });

        // Rule 2: If color is already assigned to another image of the same object, reset the earlier image to grayscale
        loadedImages.forEach(img => {
          if (img.id !== id && img.assignedColor === newColor) {
            img.assignedColor = 'grey';
            JS9.SetColormap('grey', { display: img.id });
          }
        });
      }

      // Apply colormap in JS9
      JS9.SetColormap(newColor, { display: id });

      // Evaluate whether RGB mode needs to be activated or deactivated
      evaluateRGBState();
      renderLoadedImagesUI();
    }

    function evaluateRGBState() {
      const hasColor = loadedImages.some(img => img.assignedColor !== 'grey');
      JS9.SetRGBMode(hasColor);
    }

    // --- UI Renderers ---
    function renderLoadedImagesUI() {
      const container = document.getElementById('loaded-images-list');
      container.innerHTML = '';

      if (loadedImages.length === 0) {
        container.innerHTML = '<div style="font-size: 0.8rem; color: #888;">No images loaded yet.</div>';
        return;
      }

      loadedImages.forEach(img => {
        const item = document.createElement('div');
        item.className = `image-item ${img.id === activeImageId ? 'active' : ''}`;
        item.onclick = () => setActiveImage(img.id);

        const label = document.createElement('div');
        label.className = 'image-label';
        label.innerHTML = `<span class="active-eye">👁</span> <span>${img.objectName} (${img.filterName})</span>`;

        const controls = document.createElement('div');
        controls.style.display = 'flex';
        controls.style.alignItems = 'center';

        const colorSelect = document.createElement('select');
        colorSelect.className = 'color-select';
        ['grey', 'red', 'green', 'blue'].forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
          if (c === img.assignedColor) opt.selected = true;
          colorSelect.appendChild(opt);
        });

        colorSelect.onchange = (e) => {
          e.stopPropagation();
          changeImageColor(img.id, e.target.value);
        };

        const closeBtn = document.createElement('button');
        closeBtn.className = 'btn-close';
        closeBtn.textContent = '✕';
        closeBtn.title = 'Close Image';
        closeBtn.onclick = (e) => closeImage(img.id, e);

        controls.appendChild(colorSelect);
        controls.appendChild(closeBtn);

        item.appendChild(label);
        item.appendChild(controls);
        container.appendChild(item);
      });
    }

    // --- Step 3: Scaling & Brightness Syncing ---
    function setupScaleListeners() {
      const sliderLow = document.getElementById('slider-low');
      const inputLow = document.getElementById('input-low');
      const sliderHigh = document.getElementById('slider-high');
      const inputHigh = document.getElementById('input-high');

      // Sync slider -> input box
      sliderLow.oninput = () => { inputLow.value = sliderLow.value; applyScale(); };
      sliderHigh.oninput = () => { inputHigh.value = sliderHigh.value; applyScale(); };

      // Sync input box -> slider
      inputLow.onchange = () => { sliderLow.value = inputLow.value; applyScale(); };
      inputHigh.onchange = () => { sliderHigh.value = inputHigh.value; applyScale(); };

      // Scale type toggle
      document.querySelectorAll('input[name="scaleType"]').forEach(radio => {
        radio.onchange = () => applyScale();
      });
    }

    function updateImageScaleUI() {
      if (!activeImageId) return;

      const im = JS9.GetImage({ display: activeImageId });
      if (!im) return;

      const scaleInfo = JS9.GetScale({ display: activeImageId });
      const imgData = JS9.GetImageData(false, { display: activeImageId });

      if (imgData && scaleInfo) {
        const dMin = imgData.datamin !== undefined ? imgData.datamin : scaleInfo.smin;
        const dMax = imgData.datamax !== undefined ? imgData.datamax : scaleInfo.smax;

        const sliderLow = document.getElementById('slider-low');
        const inputLow = document.getElementById('input-low');
        const sliderHigh = document.getElementById('slider-high');
        const inputHigh = document.getElementById('input-high');

        // Dynamically update limits according to active FITS pixel range
        sliderLow.min = dMin; sliderLow.max = dMax;
        sliderHigh.min = dMin; sliderHigh.max = dMax;

        sliderLow.value = scaleInfo.smin;
        inputLow.value = scaleInfo.smin;

        sliderHigh.value = scaleInfo.smax;
        inputHigh.value = scaleInfo.smax;

        // Set scaling type radio
        const currentScaleType = scaleInfo.scale || 'log';
        const radio = document.querySelector(`input[name="scaleType"][value="${currentScaleType}"]`);
        if (radio) radio.checked = true;
      }
    }

    function applyScale() {
      if (!activeImageId) return;

      const scaleType = document.querySelector('input[name="scaleType"]:checked').value;
      const smin = parseFloat(document.getElementById('input-low').value);
      const smax = parseFloat(document.getElementById('input-high').value);

      if (!isNaN(smin) && !isNaN(smax)) {
        JS9.SetScale(scaleType, smin, smax, { display: activeImageId });
      }
    }

    // --- Step 4: Labels / Regions ---
    function addCircleRegion() {
      if (activeImageId) JS9.AddRegions('circle', { display: activeImageId });
    }

    function addTextRegion() {
      if (activeImageId) {
        const text = prompt('Enter label text:', 'Target Star');
        if (text) {
          JS9.AddRegions('text', { text: text, display: activeImageId });
        }
      }
    }

    function clearAllRegions() {
      if (activeImageId) JS9.RemoveRegions('all', { display: activeImageId });
    }

    // --- Step 5: Measure ---
    function addLineRegion() {
      if (activeImageId) JS9.AddRegions('line', { display: activeImageId });
    }

    function runRegionStats() {
      if (activeImageId) JS9.RunAnalysis('regionstats', { display: activeImageId });
    }
  </script>
</body>
</html>
